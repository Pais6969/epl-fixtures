name: utsprak
description: "EPL Fixtures - jadwal, klasemen, statistik, dan pengingat pertandingan Premier League."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- UTS ---
  http: ^1.6.0
  intl: ^0.20.3
  google_fonts: ^9.0.0
  flutter_svg: ^2.3.0

  # --- UAS ---
  # Penyimpanan lokal: cache data API, klub favorit, pengaturan.
  shared_preferences: ^2.5.6
  # Notifikasi lokal terjadwal (pengingat kick-off).
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  # Lokasi GPS pengguna dan konversi alamat <-> koordinat.
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  # Membuka Google Maps dan situs resmi klub.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
